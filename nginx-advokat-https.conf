# Advokat: HTTP -> HTTPS redirect, HTTPS with proxy/root
# Serverni tuzatish: sudo cp nginx-advokat-https.conf /etc/nginx/sites-available/advokat && sudo nginx -t && sudo systemctl reload nginx

# Backend API — advokatapi.cdcgroup.uz
server {
    listen 80;
    server_name advokatapi.cdcgroup.uz;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name advokatapi.cdcgroup.uz;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/advokat.cdcgroup.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/advokat.cdcgroup.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Frontend — advokat.cdcgroup.uz
server {
    listen 80;
    server_name advokat.cdcgroup.uz;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name advokat.cdcgroup.uz;
    root /opt/advokat/frontend/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/advokat.cdcgroup.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/advokat.cdcgroup.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
